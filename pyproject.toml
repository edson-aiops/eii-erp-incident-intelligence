[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eii-erp-incident-intelligence"
version = "3.1.0"
dependencies = [
    "gradio>=5.0.0",
    "chromadb>=0.6",
    "sentence-transformers==3.1.1",
    "requests==2.32.3",
    "langsmith>=0.1.0",
    "openai>=1.0.0",
    "tenacity>=8.2.0",
    "pydantic>=2.0.0",
    "langchain-core>=0.3.0",
    "langgraph>=0.2.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "matplotlib>=3.8.0",
    "pandas>=2.0.0",
    "fastmcp>=3.0",
    "keyring>=25.0",
    "anthropic>=0.30",
]

[tool.setuptools.packages.find]
where = ["src"]